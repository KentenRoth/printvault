version: "3.9"

services:
  printvault:
    build:
      context: ./backend/PrintVault.Backend/PrintVault.Backend
      dockerfile: Dockerfile
    container_name: printvault
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      - ${INCOMING_PATH}:/app/incoming
      - ${STORAGE_ROOT}:/app/storage
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: printvault-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
